<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Специфичность</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="image-container">
      <img
        class="top-img"
        src="https://gromcode.s3.eu-central-1.amazonaws.com/front-end/html-css/lesson15/task1/big.jpeg"
        alt="big picture"
      />
    </div>
    <div class="gallery">
      <div class="card">
        <figure>
          <img
            class="opacity-img"
            src="https://gromcode.s3.eu-central-1.amazonaws.com/front-end/html-css/lesson15/task1/small.jpg"
            alt="nature opacity "
          />
          <figcaption>Opacity</figcaption>
        </figure>
      </div>
      <div class="card">
        <figure>
          <img
            class="blur-img"
            src="https://gromcode.s3.eu-central-1.amazonaws.com/front-end/html-css/lesson15/task1/small.jpg"
            alt="nature blur"
          />
          <figcaption>Blur</figcaption>
        </figure>
      </div>
      <div class="card">
        <figure>
          <img
            class="invert-img"
            src="https://gromcode.s3.eu-central-1.amazonaws.com/front-end/html-css/lesson15/task1/small.jpg"
            alt="nature invert "
          />
          <figcaption>Invert</figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
