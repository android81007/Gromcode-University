<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Специфичность</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form action="">
      <div class="control">
        <label for="">Last Name</label>
        <input type="text" name="lastName" value="Emerson" readonly />
      </div>

      <div class="control">
        <label for="">Age</label>
        <input type="number" value="17" name="age" min="3" max="10" />
      </div>

      <div class="control">
        <input type="checkbox" name="agree" disabled />
        <label for="">Accept terms and conditions </label>
      </div>

      <div class="choose-gender">
        <label for="radio-male"> 
          <input type="radio" id="radio-male" name="gender" />Male</label>

        <label for="radio-female">
          <input type="radio" id="radio-female" name="gender" />Female</label>

        <label for="radio-secret">
          <input type="radio" id="radio-secret" name="gender" checked />Secret</label>
      </div>

      <div class="control">
        <textarea
          name="description"
          placeholder="Write description..."
          id=""
          maxlength="10"
        ></textarea>
      </div>

      <div class="control">
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
