<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Специфичность</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form action="">
      <div class="control">
        <input type="text" value="Emerson" name="LastName" />
      </div>
      <div class="control">
        <input type="number" value="17" name="age" />
      </div>
      <div class="control">
        <input type="checkbox" name="agree" />
        <label for="">Accept terms and conditions. </label>
      </div>
      <div class="control choose-gender">
        <input type="radio" name="gender" /><label for="">Male</label>
        <input type="radio" name="gender" /><label for="">Female</label>
        <input type="radio" name="gender" /><label for="">Secret</label>
      </div>
      <div class="control">
        <input type="textarea" name="description" placeholder="Write description..." />
      </div>
      <div class="control">
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
